<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:-apple-system,sans-serif;background:#eee;margin:0;padding:16px}
.card{background:#f4f4f4;border-radius:16px;padding:16px}
.title{color:#555;font-size:15px;margin-bottom:16px}
.step{display:flex;gap:14px;position:relative;padding-bottom:22px}
.dot{width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;z-index:1}
.step:not(:last-child)::after{content:'';position:absolute;left:13px;top:28px;bottom:0;width:3px;background:var(--c)}
.name{font-size:18px}.sub{font-size:14px;color:#666}
.future .name{color:#999}.future .dot{background:#aaa!important}
.now .dot{box-shadow:0 0 0 6px rgba(220,120,90,.35);animation:p 1.2s infinite}
@keyframes p{50%{box-shadow:0 0 0 10px rgba(220,120,90,.1)}}
</style></head><body>
<div class="card"><div class="title" id="t"></div><div id="list"></div></div>
<script>
const q=new URLSearchParams(location.search);
const cur=+(q.get('s')||0);
const steps=[
 ['Врач',q.get('d')||'Равшан','Скан отправлен','#5a4fb5'],
 ['Ресепшн',q.get('r')||'Шахло','Наряд создан','#c95a7a'],
 ['Техник',q.get('t')||'Фармон','Моделирование','#4a9a72'],
 ['Фрезерный центр',q.get('f')||'Альшер','Фрезеровка','#d9785a'],
 ['Техник',q.get('t')||'Фармон','Синтеровка, покраска','#4a9a72'],
 ['Готово','','Выдача врачу','#888']];
document.getElementById('t').textContent=q.get('n')||'Наряд';
document.getElementById('list').innerHTML=steps.map((s,i)=>{
 const cls=i<cur?'done':i==cur?'now':'future';
 const c=i<cur?s[3]:'#ccc';
 return `<div class="step ${cls}" style="--c:${c}"><div class="dot" style="background:${s[3]}">${i<cur?'✓':'•'}</div><div><div class="name">${s[0]}${s[1]?' · '+s[1]:''}</div><div class="sub">${i==cur?'Сейчас здесь · ':''}${s[2]}</div></div></div>`}).join('');
if(window.Telegram)Telegram.WebApp.expand();
</script></body></html>
